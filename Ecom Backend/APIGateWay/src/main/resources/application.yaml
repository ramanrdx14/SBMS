server:
  port: 5555

spring:
  application:
    name: APIGateWay

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTHSERVICE
          predicates:
            - Path=/customer/**
        - id: product-service
          uri: lb://PRODUCTSERVICE
          predicates:
            - Path=/order/**,/products/**