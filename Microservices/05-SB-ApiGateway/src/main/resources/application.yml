spring:
  application:
    name: 05-SB-ApiGateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: welcome-api
            uri: lb://03-SB-WELCOMEAPI
            predicates:
              - Path=/welcome
          - id: greet-api
            uri: lb://04-DB-GREETAPI
            predicates:
              - Path=/greet

server:
  port: 3333

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG