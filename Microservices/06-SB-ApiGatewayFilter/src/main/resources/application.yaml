spring:
  application:
    name: 06-SB-ApiGatewayFilter

  cloud:
    gateway:
      routes:
        - id: welcome-api
          uri: lb://03-SB-WELCOMEAPI
          predicates:
            - Path=/welcome

      # ✅ Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

server:
  port: 3333

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG