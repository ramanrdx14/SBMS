<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 400px;">

        <h3 class="text-center mb-3">Add Book</h3>

        <p class="text-success text-center" th:text="${successmsg}"></p>

        <form th:action="@{/book/savebook}" method="post" th:object="${book}">

            <div class="mb-3">
                <label class="form-label">Book Name</label>
                <input type="text" class="form-control" placeholder="Enter Book Name" th:field="*{bookName}">
            </div>

            <div class="mb-3">
                <label class="form-label">Book Price</label>
                <input type="text" class="form-control" placeholder="Enter Book Price" th:field="*{bookPrice}">
            </div>

            <div class="mb-3">
                <input type="hidden" class="form-control" th:if="*{bookId != null}" th:field="*{bookId}">
            </div>

            <!-- Buttons aligned properly -->
            <div class="d-flex justify-content-between mt-3">
                <button type="submit" class="btn btn-primary w-50 me-2">Save</button>
                <a th:href="@{/book/show}" class="btn btn-success w-50">Show Books</a>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
