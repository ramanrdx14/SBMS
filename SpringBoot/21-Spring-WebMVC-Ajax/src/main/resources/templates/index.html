<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card p-4 shadow">
                <h4 class="text-center mb-3">Enter Numbers</h4>

                <form action="#" method="post">

                    <!-- Number 1 -->
                    <div class="mb-3">
                        <label class="form-label">Enter Number 1</label>
                        <input type="number" class="form-control" name="num1" placeholder="Enter first number" requiredd id="num1">
                    </div>

                    <!-- Number 2 -->
                    <div class="mb-3">
                        <label class="form-label">Enter Number 2</label>
                        <input type="number" class="form-control" name="num2" placeholder="Enter second number" required id="num2">
                    </div>

                    <!-- Number 2 -->
                    <div class="mb-3">
                        <label class="form-label">Result</label>
                        <input type="text" class="form-control" name="result" id="result" readonly>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" id="submit">Submit</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script>
    let submitBtn = document.getElementById("submit");
    submitBtn.addEventListener("click",(e)=>{
        let num1      = document.getElementById("num1").value;
        let num2      = document.getElementById("num2").value;
        fetch(`/sum?num1=${num1}&num2=${num2}`)
            .then(resp=>resp.json())
            .then(resp=>{
                document.getElementById("result").value = resp;
            })
            .catch(error=>console.log(error));
        e.preventDefault();
    });

</script>
</body>
</html>
