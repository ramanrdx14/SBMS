<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Client</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Add Client</h3>
        <h5 class="text-center mb4 text-success" th:text="${msg}"></h5>
        <form th:action="@{/save}" th:object="${clientdata}" method="post">

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       th:field="*{email}" placeholder="Enter email" required>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-select" th:field="*{gender}">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Courses (Optional Basic Input) -->
            <div class="mb-3">
                <label class="form-label">Courses</label>
                    <select class="form-select" th:field="*{coursesId}" multiple>
                        <option th:each="c : ${courseDetails}" th:value="${c.courseId}" th:text="${c.courseName}"></option>
                    </select>
            </div>

            <!-- Submit -->
            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Save</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
